name: Check Multica candidate in isolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Run isolated candidate checks and save the JSON report
        shell: bash
        run: |
          report="$RUNNER_TEMP/multica-candidate.json"
          status=0
          python3 -B scripts/check_multica_candidate.py --isolated > "$report" || status=$?
          cat "$report"
          {
            printf '## Multica isolated candidate check\n\nRunner exit code `%s`.\n\n' "$status"
            if [[ -s "$report" ]]; then
              printf '```json\n'
              cat "$report"
              printf '```\n'
            else
              printf 'The runner did not produce a JSON report. See the step log.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
