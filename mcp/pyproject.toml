[project]
name = "multica-backend-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp-slim[server]==4.1.6",
    "jsonschema>=4.18,<5",
    "mcp==2.3.0",
    "py-key-value-aio[filetree,wrappers-encryption]==0.4.6",
    "pydantic>=2.12,<3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
multica-backend-mcp = "multica_backend.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multica_backend*"]
